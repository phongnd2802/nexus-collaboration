[project]
name = "nexus-ai-service"
version = "0.1.0"
description = "Nexus Collaboration AI agent runtime service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "orjson>=3.10.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "arq>=0.26.0",
  "qdrant-client>=1.12.0",
  "elasticsearch>=8.14.0",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0.0",
  "opendataloader-pdf[hybrid]>=0.1.0",
  "transformers>=4.44.0",
  "tokenizers>=0.19.0",
  "pydantic-ai-slim[openai,mcp,duckduckgo]>=1.95.1",
  "pydantic-ai-harness[codemode]>=0.1.0",
  "mem0ai>=0.1.0",
  "langfuse>=3.0.0",
  "pydantic-ai-shields>=0.1.0",
  "summarization-pydantic-ai>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
nexus-ai-service = "nexus_ai_service.main:main"
nexus-ai-worker = "nexus_ai_service.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
