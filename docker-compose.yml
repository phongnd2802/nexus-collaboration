services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_collab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage


  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-master
    command: "master -ip=seaweed-master -port=9333 -defaultReplication=000"
    ports:
      - "9333:9333"
    volumes:
      - seaweed_master:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-volume
    command: "volume -mserver=seaweed-master:9333 -port=8080 -dir=/data -max=100 -preStopSeconds=1"
    volumes:
      - seaweed_volume:/data
    depends_on:
      - seaweed-master

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-filer
    command: "filer -master=seaweed-master:9333 -port=8888"
    ports:
      - "8888:8888"  # Filer UI + API
    volumes:
      - seaweed_filer:/data
    depends_on:
      - seaweed-master
      - seaweed-volume
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 3

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-s3
    command: "s3 -filer=seaweed-filer:8888 -port=8333"
    ports:
      - "8333:8333"  # S3 API endpoint
    environment:
      # Có thể override trong .env
      WEED_S3_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:-accesskey}
      WEED_S3_SECRET_KEY: ${SEAWEED_SECRET_KEY:-secretkey}
    depends_on:
      - seaweed-filer

