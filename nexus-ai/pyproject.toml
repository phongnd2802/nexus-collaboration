[project]
name = "nexus-ai"
version = "0.1.0"
description = "Standalone Nexus AI agent service using Pydantic AI, Harness, Langfuse, and nexus-mcp."
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[mcp,openrouter,anthropic]>=1.95.1",
  "pydantic-ai-harness[code-mode]>=0.1.0",
  "fastapi>=0.115.0",
  "langfuse>=3.0.0",
  "httpx>=0.27.0",
  "starlette>=0.40.0",
  "uvicorn>=0.30.0",
  "pydantic-ai-shields>=0.1.0",
  "summarization-pydantic-ai>=0.1.0",
  "qdrant-client>=1.12.0",
  "opendataloader-pdf[hybrid]>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
nexus-ai-web = "nexus_ai.web:main"
nexus-ai-check = "nexus_ai.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
