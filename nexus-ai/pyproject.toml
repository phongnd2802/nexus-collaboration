[project]
name = "nexus-ai"
version = "0.1.0"
description = "OpenAI-compatible Nexus AI agent service powered by Pydantic AI."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-ai>=1.0.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
